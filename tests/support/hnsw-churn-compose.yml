# Isolated bench for `scripts/hnsw_churn_measure.sh`.
#
# The same digest as `docker-compose.yml`'s `postgres` service: the bench therefore
# measures against the VERSIONED TARGET, which makes it reproducible and pinned.
#
# WHAT IT DOES NOT DO, and must not be credited with: reproducing the production
# RUNTIME. Measured on 2026-08-28, the two have diverged — the running
# `brain_v42_postgres` container runs image `b295c2aa…`, started from the bare tag
# before the pinning, while the digest declared here resolves to `5fa1d4c7…`.
# Consequence for `vector`: 0.8.4 available on the runtime side, 0.8.5 on the
# versioned target side, and 0.8.2 actually INSTALLED in production. Three values,
# none interchangeable. A `docker compose up -d` would recreate the container and
# move the first one without warning.
#
# `pull_policy: never` locks the image to the local content: the bench cannot switch
# silently to a newer version between two measurements.
#
# NETWORK: the bench carries a COPY of the production embeddings, in `trust`, with
# no password. It therefore lives on its own compose project's INTERNAL network
# (`internal: true`: no gateway, no egress), never on the default bridge — where any
# co-resident container reached it as superuser with no token, published port or not
# (reproduced during the PR #41 review). Everything goes through `docker exec`; no
# port is published; the script launches this file with `-p` and its `down` trap
# takes the network away with the container.
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    pull_policy: never
    container_name: ${CHURN_CONTAINER:?CHURN_CONTAINER is required}
    # An ownership marker: the script's teardown destroys ONLY what carries it
    # porte. Sans lui, `docker compose -p <nom> down` matche projet+service
    # by label, and a CHURN_CONTAINER sharing a live project's name (brain_v42…)
    # would make the trap take that project away.
    labels:
      com.brain-v42.hnsw-churn-bench: "true"
    environment:
      POSTGRES_USER: churn
      POSTGRES_DB: churn
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data:rw,size=2g
    restart: "no"

networks:
  default:
    internal: true
    labels:
      com.brain-v42.hnsw-churn-bench: "true"
