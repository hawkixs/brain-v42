# brain_v42 - GitLab CI/CD Pipeline
# ============================================
# Infra Hawkixs:
#   - PC Serveur: 192.168.1.12 (hawixs) - Apps production
#   - PC Dev GPU: 192.168.1.11 (arman) - ML/GPU workloads
# ============================================

stages:
  - lint
  - test
  - security
  - build

variables:
  UV_VERSION: "0.10.7"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

  # Security burn-in deadline (audit 2026-07-23, ticket 31d68c06).
  # The security jobs start non-blocking: a first scan of the tree already
  # surfaces 8 generic-api-key candidates to triage, and wedging main on day
  # one would get the whole stage reverted rather than fixed.
  # A bare allow_failure is how mypy drifted 0→20 errors unnoticed (brain
  # learning b5256bc1), so this deadline is enforced, not documented:
  # tests/unit/test_gitlab_ci.py::TestSecurityStage fails inside the BLOCKING
  # test:unit job once this date passes while any security job still carries
  # allow_failure. Flip them to blocking, or move this date deliberately.
  #
  # Moved 2026-08-22 -> 2026-09-30 on 2026-08-03 by operator decision, during
  # the maintenance campaign (docs/plans/2026-08-03-maintenance-campaign-plan.md,
  # decision D2). This is the "move this date deliberately" branch above, not a
  # bare postponement: the findings were re-measured first, from pipeline 4288
  # on d2e37925 whose evidence is retained outside expiring artifacts since
  # 2026-08-01. Bandit reports 16 medium and 0 high, of which 15 are B608 false
  # positives and one (B104) is a real network-bind decision. Gitleaks reports
  # 8 historical plus 2 recovery candidates, all false positives, no secret and
  # no rotation needed. pip-audit reports 45 advisories across 9 baseline
  # versions still in uv.lock. The residual is therefore dependency advisories
  # plus one bind decision, which does not justify blocking the whole unit suite
  # in the middle of the campaign.
  SECURITY_BURN_IN_UNTIL: "2026-09-30"

  # Registry (hawkixs local)
  CI_REGISTRY: "registry.hawkixs.local"
  CI_REGISTRY_IMAGE: "registry.hawkixs.local/hawkixs_project/brain_v42"
  # REGISTRY_USER & REGISTRY_PASSWORD: from group variables

  # Logging
  BRAIN_LOG_LEVEL: "WARNING"

# Cache uv downloads
cache:
  key:
    files:
      - pyproject.toml
      - uv.lock
    prefix: "uv-pip"
  paths:
    - .uv-cache/
  policy: pull-push

# Workflow rules
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        ENV_PREFIX: "prod"
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        ENV_PREFIX: "dev"
    - when: always

# ============== LINT ==============
lint:ruff:
  stage: lint
  image: &python-image python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - .venv/bin/ruff check . --output-format=gitlab
    - .venv/bin/ruff format --check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

lint:mypy:
  stage: lint
  image: *python-image
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - .venv/bin/mypy src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  # Blocking: mypy is clean (0 errors as of 2026-05-29 audit). allow_failure
  # let type errors silently drift 0→20 between 2026-03 and 2026-05 — exactly
  # the invisible-layer silent-failure pattern (brain learning b5256bc1).

# ============== TEST: UNIT ==============
# tests/unit/ is not database-free. Eight of its files opt into a real PostgreSQL
# through require_test_db_url() (tests/conftest.py), which skips when
# BRAIN_V42_TEST_DB_URL is unset. Only test:integration carried the variable, so
# those tests had never run in CI — measured 2026-08-08: 7249 passed /
# 54 skipped without it, 7294 passed / 9 skipped with it. A skip is green, so
# nothing reported the hole.
#
# The service, its credentials, the URLs and the readiness loop are copied from
# test:integration below. `alembic upgrade head` is the one addition: the schema
# is created by the session-scoped run_migrations fixture in
# tests/integration/conftest.py, and tests/unit/ has no equivalent — against a
# bare pgvector database the same tests fail on missing relations (measured
# 40 failed / 6 errors before adding it).
test:unit:
  stage: test
  image: *python-image
  services:
    - name: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
      alias: postgres
  variables:
    # pgvector service env
    POSTGRES_DB: brain_test
    POSTGRES_USER: brain
    POSTGRES_PASSWORD: brain
    # brain_v42 DB-backed unit test env
    # POSTGRES_URL takes priority in conftest; use brain_test (never 'brain') to pass the prod-guard
    POSTGRES_URL: "postgresql+asyncpg://brain:brain@postgres:5432/brain_test"
    BRAIN_V42_TEST_DB_URL: "postgresql+asyncpg://brain:brain@postgres:5432/brain_test"
    # Disable optional services not available in CI
    GRAPH_ENABLED: "false"
    # GPU embedding / reranker services are not available in CI; tests that hit
    # localhost:8003 already contain their own pytest.skip guard.
    EMBEDDING_SERVICE_URL: "http://localhost:8003"
    BRAIN_LOG_LEVEL: "WARNING"
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
    # Wait for Postgres to be ready (the service image starts fast but needs a moment)
    - |
      for i in $(seq 1 30); do
        .venv/bin/python -c "import asyncpg, asyncio; asyncio.run(asyncpg.connect('postgresql://brain:brain@postgres:5432/brain_test'))" 2>/dev/null && break
        echo "Waiting for postgres ($i/30)..."
        sleep 1
      done
    # tests/unit/ has no run_migrations fixture: apply the schema here or the
    # DB-backed tests fail on missing relations instead of skipping.
    # The console script, not `python -m alembic`: check_container_image_pins.py
    # is fail-closed on `python -m <module>` in CI and refuses the pipeline.
    - .venv/bin/alembic upgrade head
  script:
    - .venv/bin/python scripts/check_module_layering.py --package src/brain_v42
    - .venv/bin/python scripts/check_container_image_pins.py
    - .venv/bin/pytest tests/unit/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============== TEST: COVERAGE ==============
# `Settings()` exige POSTGRES_URL — sans lui, test_the_setting_ships_closed tombe
# en ValidationError. La variable suffit : le test ne se CONNECTE pas, il lit un
# réglage. Aucun service Postgres ici, et surtout PAS de BRAIN_V42_TEST_DB_URL :
# les 51 tests adossés à une base ne passent pas dans le Postgres de la CI, qui
# persiste entre pipelines et ignore POSTGRES_DB (ticket ouvert). Les réveiller
# ici échangerait 2 échecs contre 31.
test:coverage:
  stage: test
  image: *python-image
  variables:
    POSTGRES_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
    GRAPH_ENABLED: "false"
    EMBEDDING_SERVICE_URL: "http://localhost:8003"
    BRAIN_LOG_LEVEL: "WARNING"
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - .venv/bin/pytest tests/unit/ --cov=brain_v42 --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============== TEST: INTEGRATION ==============
test:integration:
  stage: test
  image: *python-image
  services:
    - name: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
      alias: postgres
  variables:
    # pgvector service env
    POSTGRES_DB: brain_test
    POSTGRES_USER: brain
    POSTGRES_PASSWORD: brain
    # brain_v42 integration test env
    # POSTGRES_URL takes priority in conftest; use brain_test (never 'brain') to pass the prod-guard
    POSTGRES_URL: "postgresql+asyncpg://brain:brain@postgres:5432/brain_test"
    BRAIN_V42_TEST_DB_URL: "postgresql+asyncpg://brain:brain@postgres:5432/brain_test"
    # Disable optional services not available in CI
    GRAPH_ENABLED: "false"
    # GPU embedding / reranker services are not available in CI; tests that hit
    # localhost:8003 already contain their own pytest.skip guard (see
    # test_recent_patches.py::test_real_reranker_scores_in_unit_range).
    # No -k filter needed: the guard fires automatically when the service is absent.
    EMBEDDING_SERVICE_URL: "http://localhost:8003"
    BRAIN_LOG_LEVEL: "WARNING"
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
    # Wait for Postgres to be ready (the service image starts fast but needs a moment)
    - |
      for i in $(seq 1 30); do
        .venv/bin/python -c "import asyncpg, asyncio; asyncio.run(asyncpg.connect('postgresql://brain:brain@postgres:5432/brain_test'))" 2>/dev/null && break
        echo "Waiting for postgres ($i/30)..."
        sleep 1
      done
  script:
    - .venv/bin/pytest tests/integration/ -v --tb=short --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ============== SECURITY ==============
# Placed after `test` so a scan backlog never delays the feedback developers
# actually act on, but every job carries `needs: []` and therefore starts with
# the pipeline instead of waiting for lint and test to drain.
.security-rules: &security-rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"
  - if: $CI_COMMIT_BRANCH == "dev"

# Dependency vulnerabilities. Audits the exported lock rather than the live
# venv, so the scan covers exactly the graph that ships and stays reproducible.
# Freshness policy: every pipeline queries the live PyPI advisory service with
# no offline fallback; a bounded timeout and --strict make outages fail closed.
security:pip-audit:
  stage: security
  image: *python-image
  needs: []
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - uv export --locked --no-dev --extra dev --format requirements-txt --no-emit-project -o requirements-audit.txt
    - .venv/bin/pip-audit -r requirements-audit.txt --require-hashes --disable-pip --vulnerability-service pypi --timeout 15 --strict --progress-spinner=off
  artifacts:
    when: always
    paths:
      - requirements-audit.txt
    expire_in: 1 week
  allow_failure: true # until SECURITY_BURN_IN_UNTIL — enforced by test:unit
  rules: *security-rules

# The embedding supervisor has its own declared dependency graph. Recompile it
# in CI and compare byte-for-byte so the image and scan never drift from its
# committed, hash-complete lock. This job is deliberately blocking.
security:pip-audit:embedding-supervisor:
  stage: security
  image: *python-image
  needs: []
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - >-
      uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_28
      --resolution highest --generate-hashes --default-index https://pypi.org/simple
      --custom-compile-command "uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_28 --resolution highest --generate-hashes --default-index https://pypi.org/simple services/embedding_supervisor/requirements.txt -o services/embedding_supervisor/requirements.lock"
      services/embedding_supervisor/requirements.txt -o requirements-embedding-supervisor.generated.lock
    - cmp --silent services/embedding_supervisor/requirements.lock requirements-embedding-supervisor.generated.lock
    - .venv/bin/pip-audit -r services/embedding_supervisor/requirements.lock --require-hashes --disable-pip --vulnerability-service pypi --timeout 15 --strict --progress-spinner=off
  artifacts:
    when: always
    paths:
      - requirements-embedding-supervisor.generated.lock
    expire_in: 1 week
  rules: *security-rules

# SAST. -ll reports medium severity and above; the low band is dominated by
# assert_used/subprocess noise that would bury the findings worth reading.
security:bandit:
  stage: security
  image: *python-image
  needs: []
  before_script:
    - pip install "uv==$UV_VERSION"
    - uv sync --locked --no-dev --extra dev
  script:
    - .venv/bin/bandit -ll -r src/
  allow_failure: true # until SECURITY_BURN_IN_UNTIL — enforced by test:unit
  rules: *security-rules

# Secret scanning. `dir` scans the checked-out tree: gitleaks 8.30 dropped the
# `detect` subcommand, and a filesystem scan is correct under the shallow clone
# CI uses, where a history scan would silently cover only the last commits.
security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  needs: []
  script:
    - gitleaks dir . --no-banner --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    paths:
      - gitleaks.sarif
    expire_in: 1 week
  allow_failure: true # until SECURITY_BURN_IN_UNTIL — enforced by test:unit
  rules: *security-rules

# ============== BUILD: DOCKER ==============
build:docker:
  stage: build
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin $CI_REGISTRY
    - export SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
  script:
    - docker build
      --cache-from $CI_REGISTRY_IMAGE:${ENV_PREFIX}-latest
      --build-arg UV_VERSION=$UV_VERSION
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t $CI_REGISTRY_IMAGE:${ENV_PREFIX}-latest
      -t $CI_REGISTRY_IMAGE:${ENV_PREFIX}-${SHORT_SHA}
      -t brain-v42-ci-smoke:${CI_COMMIT_SHA}
      -f Dockerfile .
    - >-
      docker run --pull=never --rm brain-v42-ci-smoke:${CI_COMMIT_SHA}
      python -c 'import os, pathlib, sys; import brain_v42.mcp.server; venv = pathlib.Path("/app/.venv"); entrypoint = pathlib.Path(brain_v42.mcp.server.__file__); assert sys.executable == "/app/.venv/bin/python"; assert os.geteuid() == 1000; assert venv.stat().st_uid == 0; assert entrypoint.stat().st_uid == 0; assert not os.access(venv, os.W_OK); assert not os.access(entrypoint, os.W_OK)'
    - docker push $CI_REGISTRY_IMAGE:${ENV_PREFIX}-latest
    - docker push $CI_REGISTRY_IMAGE:${ENV_PREFIX}-${SHORT_SHA}
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
