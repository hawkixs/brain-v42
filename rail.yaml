rail: 1
project: brain-v42
brain_key: brain-v42
tier: prod
stack: python
ledger: file
drill:
  schema_head:
    path: ops/recovery/current.json
    field: schema_head
  restore:
    database_image: pgvector/pgvector@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    database_env:
      - POSTGRES_URL
    # This is the complete application environment allow-list. Each switch below
    # disables an external writer or caller; only the restored database is needed.
    env:
      BRAIN_MCP_TRANSPORT: http
      BRAIN_MCP_AUTH_MODE: shared_token
      MCP_HTTP_HOST: 127.0.0.1
      MCP_HTTP_PORT: "8765"
      # Drill-only: safe only on the rail's own unique --internal Docker network,
      # with no published port, no route to production and no credential file mounted.
      # Production configuration must never carry this switch; enforced by
      # tests/unit/test_drill_auth_config_hygiene.py.
      MCP_HTTP_ALLOW_UNAUTHENTICATED: "true"
      GRAPH_ENABLED: "false"
      GRAPH_LEDGER_WRITE_ENABLED: "false"
      GRAPH_PROJECTOR_ENABLED: "false"
      METRICS_ENABLED: "false"
      CLIENT_ACTIVITY_REPORTING_ENABLED: "false"
      BRAIN_SESSION_AUTO_OPEN_ENABLED: "false"
      BRAIN_SESSION_INACTIVE_SWEEP_ENABLED: "false"
      # The embedding client is still built, but points at an unused loopback port.
      # The --internal network gives the container no route out; on a restored
      # database the one-shot startup plan-index finds nothing new to index,
      # so no embedding call succeeds or leaves the container.
      EMBEDDING_SERVICE_URL: http://127.0.0.1:8003
      RERANK_BACKEND: none
      BRAIN_DELIVERY_ENABLED: "false"
    env_deny_prefixes:
      - SECRET
      - TOKEN
      - KEY
      - PASSWORD
      - PASS
      - API_KEY
      - PRIVATE
    health_command:
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"
    read_command:
      - python
      - -c
      - "import asyncio; from sqlalchemy import text; from brain_v42.db.engine import get_engine; exec(\"async def run():\\n async with get_engine().connect() as c:\\n  await c.execute(text('SELECT count(*) FROM learnings'))\"); asyncio.run(run())"
    schema_head_file: schema_head.txt
    disk_margin: 2.0
deploy:
  target: private-compose
  site: red-base
  healthcheck: "http://${BIND_ADDRESS}:8765/healthz"
gates:
  docs.root:
    value: internal/docs/superpowers
    reason: "specs and plans are dated working notes kept in the private brain-v42-internal clone (ticket 8dc6f0d2)"
  hygiene.docs_layout:
    value: false
    reason: "ADRs live in Brain (brain_propose_adr), not in a docs/adr folder: operator decision 2026-10-03; specs/ and plans/ are still read by the design and plan gates"
  deploy.ssh_host:
    value: red-base-deploy
    reason: "SSH alias on the rail host: the dedicated red-rail deploy user on red-base, whose key is accepted from the rail host only"
  observe.monitor_agent:
    value: red-base
    reason: "brain-v42 runs on red-base, so observe.visible must query the red-monitor agent of that machine; the default (vps) is the edge"
