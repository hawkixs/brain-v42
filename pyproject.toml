[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain_v42"
# 0.x on purpose: the version contract lives in README.md#versioning, and it
# refuses to promise a lossless downgrade (037 and 039 refuse theirs).
version = "0.3.0"
description = "Second Cerveau v42 - Mémoire persistante pour Claude Code via MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Hawixs", email = "armandasm@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    # Database
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    # HTTP client (GPU embedding service)
    "httpx>=0.27",
    # HTTP server (metrics sidecar)
    "aiohttp>=3.9",
    # Codex management gateway
    "fastapi>=0.139.2,<0.140",
    "uvicorn>=0.41,<1",
    # MCP
    "fastmcp>=3.4.1,<4",
    "mcp>=1.27,<2",
    "starlette>=1.0.1",
    # Validation & Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Logging
    "structlog>=24.1",
    # Reranker — uses shared unified HTTP service on :8003 (no local model deps)
    # Graph (optional Neo4j relationship index — disabled by default)
    "neo4j>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/hawkixs/brain-v42"
Repository = "https://github.com/hawkixs/brain-v42"

[project.scripts]
# Console entry points for the maintenance CLIs that already expose a
# synchronous `main(argv: list[str] | None = None) -> int`. The async-main
# scripts under src/brain_v42/scripts/ (roadmap_curate, ticket_extract,
# domain_backfill, benchmark, ...) are intentionally NOT wired here: doing so
# would mean inventing new sync wrapper functions, which is out of scope for
# packaging the scripts that already migrated cleanly. They stay reachable
# via `python scripts/<name>.py` (thin cron/systemd wrappers, unchanged) or
# `python -m brain_v42.scripts.<name>`.
brain-v42-backfill-graph-ledger = "brain_v42.scripts.backfill_graph_ledger:main"
brain-v42-domain-backfill-apply = "brain_v42.scripts.domain_backfill_apply:main"
brain-v42-repair-plan-index = "brain_v42.scripts.repair_plan_index:main"
brain-v42-rebuild-graph-projection = "brain_v42.scripts.rebuild_graph_projection:main"
brain-v42-recover-graph-projection = "brain_v42.scripts.recover_graph_projection:main"
brain-v42-mint-dream-capability-registry = "brain_v42.scripts.mint_dream_capability_registry:main"
brain-v42-domain-backfill = "brain_v42.scripts.domain_backfill:main"

[project.optional-dependencies]
# OTel tracing of tool calls — a SEPARATE extra, never in `dependencies`.
# The OTLP HTTP exporter pulls `protobuf` and `googleapis-common-protos`
# transitively (measured: 8 packages for opentelemetry-sdk 1.44.0), which has
# no business weighing on an install that does not trace. `brain_v42.tracing`
# imports the SDK INSIDE its functions and returns False when it is missing:
# the absence of this extra is a NORMAL state, not a failure.
tracing = [
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
dev = [
    # EXACTLY pinned CI toolchain (learning c43ed8b8): unpinned deps →
    # local != CI, and main turns red on an upstream upgrade (mypy 1.19.1
    # local vs 2.2.0 in CI, 2026-07-10). An upgrade is an explicit, green commit.
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.18",
    "mypy==2.2.0",
    # Security scanners for the CI `security` stage. Pinned exactly like the
    # rest of the toolchain: a floating scanner turns a green commit red on an
    # upstream release, which is how a non-blocking gate gets ignored for good.
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "types-setuptools",
    "tabulate>=0.9",
    # Async SQLite engine for the dream_run/feature service unit tests. Must be
    # here (not only in [dependency-groups]) — CI installs via `pip install
    # -e .[dev]`, which does NOT read PEP 735 dependency-groups, so these tests
    # errored with ModuleNotFoundError on CI (masked while lint blocked tests).
    "aiosqlite>=0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brain_v42"]

# The migrations travel WITH the package. Measured before this block: the wheel
# carried 192 entries and ZERO alembic — the `alembic` binary was shipped by the
# dependency, not the revisions it is meant to run.
#
# `force-include` COPIES the tree into the distribution without moving the
# sources: `alembic/` and `alembic.ini` stay at the repository root, where
# `tests/unit/test_alembic_env.py` resolves them from PROJECT_ROOT. The
# destination sits under `brain_v42/` — inside the importable package — so it
# stays reachable from `brain_v42.__file__` after installation, rather than
# stranded at the root of site-packages where nothing could find it again.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "brain_v42/alembic"
"alembic.ini" = "brain_v42/alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-m "not bench_docker"` EXCLUDES the container bench by default, CI included:
# the integration job runs `pytest tests/integration/`, which would otherwise
# spin disposable Postgres containers on every push. The bench is run on demand,
# locally, with `-m bench_docker` — and its report says when it last ran.
addopts = "-v --tb=short -m 'not bench_docker'"
markers = [
    "bench_docker: spins disposable Docker containers; excluded by default, run with -m bench_docker",
]
pythonpath = ["src"]
# The net that holds whatever the cause. Twice, CI produced THIRTY MINUTES of
# silence and then a killed job: a hang says nothing, and no application-level
# bound covers the wait nobody planned for. faulthandler dumps ALL the stacks
# after 120 s inside a test, then exits — the next hang will name its own
# `await`, whichever one it turns out to be.
#
# 120 s sits far above reality: the whole integration suite runs in ~91 s for
# 348 tests, and the widest application budget for a single call is 90 s. This
# threshold therefore catches only what never comes back.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["brain_v42"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/brain_v42"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
