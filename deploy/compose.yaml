# Operator prerequisites (all paths are absolute; never put secrets in the rail .env):
# The rail runs `docker compose` over ssh as red-rail (uid 1001 on red-base, in the
# docker group), so the compose CLI reads env_files as the rail deploy user, not as
# root: each env_file is owned by uid 1001, mode 0600. Their contents participate
# in the recreate hash.
# /etc/brain-v42/postgres-owner.env: uid 1001, mode 0600 (POSTGRES_URL, owner brain)
# /etc/brain-v42/postgres-app.env: uid 1001, mode 0600 (POSTGRES_URL, runtime brain_app)
# Both DSNs target postgres:5432/brain; never include BRAIN_POSTGRES_URL overrides.
# /etc/brain-v42/graph-projector.env: uid 1001, mode 0600 (GRAPH_PROJECTOR_NEO4J_PASSWORD)
# /etc/brain-v42/facts-identity.env: uid 1001, mode 0600 (empty initially; operator fills
# BRAIN_FACTS_PRODUCTION_IDENTITY after measuring the first deployed cluster)
# /etc/brain-v42/delivery-mcp.env: uid 1001, mode 0600 (MCP delivery settings)
# MCP_HTTP_TOKEN must be absent: credentials mode refuses the shared bearer.
# Compose file secrets preserve HOST ownership/mode; uid/mode remapping is unsupported.
# /etc/brain-v42/postgres-password: uid 999, mode 0600 (matches owner DSN password)
# /etc/brain-v42/neo4j-auth: uid 7474, mode 0600 (neo4j/password; _FILE pattern)
# /etc/brain-v42/brain-app-password: uid 1000, mode 0600 (matches runtime DSN password)
# /etc/brain-v42/embedding-token: uid 1000, mode 0600 (hosted embedding API key)
# /etc/brain-v42/voyage-api-key: uid 1000, mode 0600 (operator's Voyage key, value only;
# read by mcp only; primary rerank link, Voyage's own API: decisions fa3b6abc, 7d36a08c).
# /etc/brain-v42/rerank-api-key: uid 1000, mode 0600 (OpenRouter key, value only; read by
# mcp only; fallback link cohere/rerank-4-fast with data collection denied, used when Voyage
# fails within its 1.6 s share of the 3.0 s budget; RRF order only when both links fail
# (go 742e7a05).
# Rerank rollback: set the x-rerank-env block to BRAIN_RERANK_BACKEND "none" alone (the
# settings validator refuses any other rerank line next to it), then redeploy through the
# rail. A rotated key needs an explicit recreate.
# /etc/brain-v42/github-app-key.pem: uid 1000, mode 0600 (GitHub App private key)
# /etc/brain-v42/delivery-observer.env: uid 1000, mode 0600 (the real observer config,
# read via --env-file; BRAIN_DELIVERY_ENABLED=true, BRAIN_DELIVERY_POSTGRES_URL for brain_app,
# BRAIN_DELIVERY_GITHUB_APP_ID, BRAIN_DELIVERY_GITHUB_INSTALLATION_ID and
# BRAIN_DELIVERY_GITHUB_PRIVATE_KEY_PATH=/run/secrets/github_app_key).
# Changing the observer config needs an explicit recreate; it is a mounted secret,
# not a Compose env_file whose contents participate in the config hash.
# /etc/brain-v42/activity/token: uid 1000, mode 0600 (may be created after deployment)
# This credential must carry telemetry rights and client_id brain-v42-mcp.
# BRAIN_CLIENT_ACTIVITY_ALLOWED_HOST=metrics names the same-host Compose peer;
# no other non-loopback activity destination is authorized.
# Create /etc/brain-v42/activity first; mount the directory to see a later token file.
# Runtime readers need directory traversal permission to their mounted secret paths.
# Rotating startup file secrets requires an explicit recreate; file contents are not
# in Compose's config hash. The activity token is read lazily instead.
# Restore input directory /srv/brain-v42/restore: root:1000, mode 0750.
# /srv/brain-v42/restore/brain.dump: root:1000, mode 0640.
# /srv/brain-v42/restore/brain.dump.sha256: root:1000, mode 0640.
# A marked database needs neither file on subsequent deployments.
# Persistent volumes: brain-v42-postgres-data and brain-v42-neo4j-data.
# Empty-volume retry: stop writers, remove these two volumes only after operator
# approval, then replay the verified restore -> migrate -> graph-bootstrap chain.
# Memory headroom above measured RSS: postgres 238 MiB -> 2g, MCP 224 MiB -> 4g (see below),
# metrics 191 MiB -> 384m, delivery-observer 124 MiB -> 256m. One-shots get 512m;
# weekly graph inventory, the daily session sweep and the hourly embedding backfill get
# 256m each. Neo4j has 1G heap + 1G page cache within 2.5g.
# On 2026-10-16 the MCP container was OOM-killed at 512m by a child task while many
# agents ran in parallel: the MCP now gets 4g and postgres 2g. The host has 22 GiB of RAM,
# and these are ceilings against a runaway, not a budget the steady state should reach.

name: brain-v42

x-brain-env: &brain-env
  BRAIN_LOG_FORMAT: "json"

x-brain-service: &brain-service
  image: ${IMAGE_REFERENCE}
  user: "1000:1000"
  labels:
    org.opencontainers.image.revision: ${GIT_SHA}
    org.opencontainers.image.version: ${VERSION}
    io.brain-v42.image.digest: ${IMAGE_DIGEST}

x-graph-env: &graph-env
  <<: *brain-env
  GRAPH_ENABLED: "true"
  GRAPH_LEDGER_WRITE_ENABLED: "true"
  GRAPH_PROJECTOR_ENABLED: "true"
  GRAPH_PROJECTOR_NEO4J_URL: bolt://neo4j:7687
  GRAPH_PROJECTOR_NEO4J_USER: neo4j

x-embedding-env: &embedding-env
  EMBEDDING_BACKEND: openai
  EMBEDDING_SERVICE_URL: https://api.mistral.ai
  EMBEDDING_MODEL: codestral-embed-2505
  EMBEDDING_DIMENSION: "1536"
  BRAIN_EMBEDDING_TOKEN_FILE: /run/secrets/embedding_token

# Hosted reranker (lot 0.6.10): Voyage's own API first (operator key, own quota), Cohere
# through OpenRouter as the fallback link. Rollback: keep only BRAIN_RERANK_BACKEND: "none".
x-rerank-env: &rerank-env
  BRAIN_RERANK_BACKEND: "voyage"
  BRAIN_RERANKER_URL: https://api.voyageai.com
  BRAIN_RERANK_MODEL: rerank-3-lite
  BRAIN_RERANK_API_KEY_FILE: /run/secrets/voyage_api_key
  BRAIN_RERANK_FALLBACK_MODEL: cohere/rerank-4-fast
  BRAIN_RERANK_FALLBACK_PROVIDER: '{"only":["cohere"],"allow_fallbacks":false,"data_collection":"deny"}'
  BRAIN_RERANK_FALLBACK_URL: https://openrouter.ai/api
  BRAIN_RERANK_FALLBACK_API_KEY_FILE: /run/secrets/rerank_api_key
  BRAIN_RERANK_BUDGET_SECONDS: "3.0"
  BRAIN_RERANK_PRIMARY_BUDGET_SECONDS: "1.6"

x-server: &server
  restart: unless-stopped
  depends_on:
    graph-bootstrap:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    container_name: brain-v42-postgres
    restart: unless-stopped
    mem_limit: 2g
    environment:
      POSTGRES_USER: brain
      POSTGRES_DB: brain
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all]
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, brain, -d, brain]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26.21@sha256:409728716bc239f9fa046368ac6ce6ef280f9e5f0bcb7cdd75031a4465cc192d
    container_name: brain-v42-neo4j
    restart: unless-stopped
    mem_limit: 2.5g
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "1G"
    secrets:
      - neo4j_auth
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  restore:
    <<: *brain-service
    container_name: brain-v42-restore
    restart: "no"
    mem_limit: 512m
    command: [brain-v42-restore, --dump, /restore/brain.dump]
    environment: *brain-env
    env_file:
      - /etc/brain-v42/postgres-owner.env
    volumes:
      - /srv/brain-v42/restore:/restore:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *brain-service
    container_name: brain-v42-migrate
    restart: "no"
    mem_limit: 512m
    command: [brain-v42-migrate]
    env_file:
      - /etc/brain-v42/postgres-owner.env
    environment:
      <<: *brain-env
      BRAIN_ALEMBIC_ALLOW_PROD: "true"
      BRAIN_APP_PASSWORD_FILE: /run/secrets/brain_app_password
    secrets:
      - brain_app_password
    depends_on:
      postgres:
        condition: service_healthy
      restore:
        condition: service_completed_successfully

  graph-bootstrap:
    <<: *brain-service
    container_name: brain-v42-graph-bootstrap
    restart: "no"
    mem_limit: 512m
    command: [brain-v42-graph-bootstrap]
    env_file:
      - /etc/brain-v42/postgres-app.env
      - /etc/brain-v42/graph-projector.env
    environment: *graph-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  mcp:
    <<: [*brain-service, *server]
    container_name: brain-v42-mcp
    mem_limit: 4g
    command: [python, -m, brain_v42.mcp.server]
    ports:
      - "${BIND_ADDRESS}:8765:8765"
    env_file:
      - /etc/brain-v42/postgres-app.env
      - /etc/brain-v42/graph-projector.env
      - /etc/brain-v42/facts-identity.env
      - /etc/brain-v42/delivery-mcp.env
    environment:
      <<: [*graph-env, *embedding-env, *rerank-env]
      BRAIN_MCP_TRANSPORT: http
      BRAIN_MCP_AUTH_MODE: credentials
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8765"
      MCP_HTTP_ALLOW_NON_LOOPBACK: "true"
      MCP_HTTP_ALLOWED_HOSTS: "${BIND_ADDRESS}:8765"
      # METRICS_ENABLED starts the MCP's metrics flusher; without it no tool or
      # refusal counter reaches the metrics sidecar. The five flags carry the
      # workstation's arming to red-base by operator decision 10cfe7ae.
      # Red-base declares this arming here: changes require a Compose pull request
      # followed by a rail deploy; live values are still measured from the running
      # container's environment.
      METRICS_ENABLED: "true"
      BRAIN_SESSION_AUTO_OPEN_ENABLED: "true"
      BRAIN_SESSION_DERIVED_CAPTURE_ENABLED: "true"
      BRAIN_SESSION_INACTIVE_SWEEP_ENABLED: "true"
      BRAIN_SESSION_RELAY_GUARD_MOD_ENABLED: "true"
      BRAIN_DECAY_HUMAN_SIGNAL_ENABLED: "true"
      BRAIN_FACTS_LIVE_RELEASE_IDENTITY: '{"release_sha":"${GIT_SHA}","package_version":"${VERSION}"}'
      # The rail verifies /version against the artefact.
      BRAIN_GIT_SHA: "${GIT_SHA}"
      BRAIN_IMAGE_DIGEST: "${IMAGE_DIGEST}"
      BRAIN_CLIENT_ACTIVITY_TOKEN_FILE: /etc/brain-v42/activity/token
      BRAIN_CLIENT_ACTIVITY_REPORTING_ENABLED: "true"
      BRAIN_CLIENT_ACTIVITY_URL: http://metrics:9200/v1/client-activity
      BRAIN_CLIENT_ACTIVITY_ALLOWED_HOST: "metrics"
    secrets:
      - embedding_token
      - voyage_api_key
      - rerank_api_key
    volumes:
      - /etc/brain-v42/activity:/etc/brain-v42/activity:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  metrics:
    <<: [*brain-service, *server]
    container_name: brain-v42-metrics
    mem_limit: 384m
    command: [python, -m, brain_v42.metrics]
    ports:
      - "${BIND_ADDRESS}:9200:9200"
    env_file:
      - /etc/brain-v42/postgres-app.env
    environment:
      <<: [*brain-env, *embedding-env]
      METRICS_HOST: "0.0.0.0"
      METRICS_PORT: "9200"
      # The sidecar cannot see host systemd; red-base runs no Dream unit (decision 52c96594).
      METRICS_DREAM_SCHEDULER: none
      METRICS_ALLOW_NON_LOOPBACK: "yes"
      METRICS_RECEIVER_AUTH: credentials
      METRICS_READ_CLIENTS: "red-cockpit"
      # This runtime refuses the projector role and exposes no facts registry.
      GRAPH_PROJECTOR_ENABLED: "false"
      # Dormant by decision: feature_dedup runs nowhere, the roadmap is being retired
      # (0f008a1c, operator ruling 2026-10-13). See OPERATIONS, "Automation service".
      METRICS_LEGACY_AUTOMATION_ENABLED: "false"
    secrets:
      - embedding_token
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  delivery-observer:
    <<: [*brain-service, *server]
    container_name: brain-v42-delivery-observer
    mem_limit: 256m
    command: [python, -m, brain_v42.delivery_observer, --env-file, /run/secrets/observer_config]
    environment:
      <<: *brain-env
      BRAIN_DELIVERY_HEARTBEAT_PATH: /tmp/brain-v42-delivery-observer.heartbeat
    secrets:
      - github_app_key
      - observer_config
    healthcheck:
      # No HTTP readiness endpoint exists; this checks recent observation progress.
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/tmp/brain-v42-delivery-observer.heartbeat'); assert p.is_file() and time.time()-p.stat().st_mtime <= 600"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  graph-recon:
    <<: [*brain-service, *server]
    container_name: brain-v42-graph-recon
    mem_limit: 256m
    # Runs the same weekly inventory module as the workstation's brain-v42-graph-recon unit.
    command:
      - /bin/sh
      - -c
      - |
        while sleep 604800; do
          python -m brain_v42.scripts.rebuild_graph_projection || exit 1;
        done
    env_file:
      - /etc/brain-v42/postgres-app.env
      - /etc/brain-v42/graph-projector.env
    environment: *graph-env
    healthcheck:
      # The first inventory is a week away; health means the scheduler is alive.
      test: [CMD, python, -c, "from pathlib import Path; assert b'while sleep 604800' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  session-sweep:
    <<: [*brain-service, *server]
    container_name: brain-v42-session-sweep
    mem_limit: 256m
    # Runs the seven-day rule of the workstation's Dream sweep phase (auto_stale_7d),
    # once at start and then daily (ticket 888660a9). The MCP server's own net already
    # closes idle agent traces every fifteen minutes, so the four-hour rule stays off
    # here. The same loop then runs the retention of closed agent traces and delivered
    # graph_outbox rows (ticket 8f319827). Both shipped dry and were armed by the
    # operator on 2026-10-13 after the dry run of the 0.6.12 deploy: --wet abandons the
    # stale sessions, --execute deletes. Disarming is removing the flag, through a pull
    # request and a rail deploy. A failed run is retried the next day instead of
    # crash-looping the container; a heartbeat that cannot be written after a
    # successful run is reported as such, not as a failed run.
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          if python -m brain_v42.maintenance.session_sweep --wet; then touch /tmp/brain-v42-session-sweep.heartbeat || echo "session-sweep: run succeeded, heartbeat not written" >&2; else echo "session-sweep: run failed, next attempt in 24 h" >&2; fi;
          if python -m brain_v42.maintenance.trace_retention --execute; then touch /tmp/brain-v42-trace-retention.heartbeat || echo "trace-retention: run succeeded, heartbeat not written" >&2; else echo "trace-retention: run failed, next attempt in 24 h" >&2; fi;
          sleep 86400;
        done
    env_file:
      - /etc/brain-v42/postgres-app.env
    environment: *brain-env
    healthcheck:
      # Each job touches its heartbeat only when it succeeds (ticket abbfabfd): the check
      # fails once either file is missing or older than a day plus two hours, so a loop
      # that still runs but no longer completes a run turns the container unhealthy.
      # The start period covers the first runs, made at start.
      test: [CMD, python, -c, "import time; from pathlib import Path; assert all(time.time() - Path(p).stat().st_mtime <= 93600 for p in ('/tmp/brain-v42-session-sweep.heartbeat', '/tmp/brain-v42-trace-retention.heartbeat'))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m

  embedding-backfill:
    <<: [*brain-service, *server]
    container_name: brain-v42-embedding-backfill
    mem_limit: 256m
    # Drains the durable embedding backlog (ticket c0d510e3): every write persists its
    # row with a NULL vector first and leaves it to this backlog when the embedding
    # provider fails, and red-base had no runner, so such a row would stay out of
    # semantic search for good. Every project and every entity type, once at start
    # and then hourly. DRY: without --execute it only counts the backlog and prints
    # the report; arming it (which also needs the graph stack for linking) is a
    # separate pull request, after a dry run's journal was read. A failed run is
    # retried the next hour instead of crash-looping the container.
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          python -m brain_v42.maintenance.embedding_backfill --batch-size 20 --limit 200 || echo "embedding-backfill: run failed, next attempt in 1 h" >&2;
          sleep 3600;
        done
    env_file:
      - /etc/brain-v42/postgres-app.env
    environment:
      <<: [*brain-env, *embedding-env]
    secrets:
      # The embedding client resolves its token file at construction, even dry.
      - embedding_token
    healthcheck:
      # Liveness of the hourly loop only, not run progress: reports go to the container log.
      test: [CMD, python, -c, "from pathlib import Path; assert b'brain_v42.maintenance.embedding_backfill' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  postgres_password:
    file: /etc/brain-v42/postgres-password
  neo4j_auth:
    file: /etc/brain-v42/neo4j-auth
  brain_app_password:
    file: /etc/brain-v42/brain-app-password
  embedding_token:
    file: /etc/brain-v42/embedding-token
  voyage_api_key:
    file: /etc/brain-v42/voyage-api-key
  rerank_api_key:
    file: /etc/brain-v42/rerank-api-key
  github_app_key:
    file: /etc/brain-v42/github-app-key.pem
  observer_config:
    file: /etc/brain-v42/delivery-observer.env

volumes:
  postgres-data:
    name: brain-v42-postgres-data
  neo4j-data:
    name: brain-v42-neo4j-data
