# Host compatibility shim for hosts that restrict unprivileged user namespaces
# (Ubuntu 24.04+ / systemd 259: kernel.apparmor_restrict_unprivileged_userns=1).
#
# systemd-executor's user namespace (PrivateUsers=true) lands in the AppArmor profile
# `unprivileged_userns`, which denies setpcap and sys_admin: any capability drop
# (CapabilityBoundingSet=) then fails with status=218/CAPABILITIES, and the service never
# starts. NoNewPrivileges=true keeps an unprivileged service from gaining any capability
# anyway, so an empty bounding set adds nothing on top of it.
#
# Installed by deploy/systemd/install.sh and install-delivery-observer.sh ONLY when
# /proc/sys/kernel/apparmor_restrict_unprivileged_userns reads 1, and removed by the next
# install.sh run on a host that no longer restricts: the installed state follows the host.
# PrivateUsers=, NoNewPrivileges= and the rest of the sandbox are left untouched.
[Service]
CapabilityBoundingSet=~
PrivateDevices=false
ProtectClock=false
ProtectKernelLogs=false
ProtectKernelModules=false
