# brain_v42 Alembic configuration

[alembic]
# Path to migration scripts, resolved from THIS file rather than from the current
# directory. `%(here)s` is the ini's own folder: it lands on the repository root in
# development, on /app inside the image, and on site-packages/brain_v42/ in an
# installed wheel. Without it, `alembic -c <installed ini> upgrade head` failed with
# "Path doesn't exist: alembic" as soon as the CWD was not the right one.
script_location = %(here)s/alembic

# Template for revision file names: sequential numbered format
# e.g. 001_initial.py, 002_add_foo.py
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Split prepend_sys_path on os.pathsep (silences legacy-splitting deprecation).
path_separator = os

# SQLAlchemy URL — intentionally empty.
# alembic/env.py injects the explicit POSTGRES_URL from the process environment.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Alternatively, use the exec runner to execute a binary found on your PATH
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
