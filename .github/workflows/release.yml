# brain_v42 - GitHub Actions, rail de release.
#
# This rail runs WITH THE RUNNER OFF, and that is its reason to exist. Measured
# 2026-08-14: 19 runs of the delivery rail, 19 `cancelled`, 0 successes, because
# [self-hosted, Linux, X64, red-ci] is started on demand and its `offline` state
# is NORMAL. A release placed there would never have run: it would have waited
# for the manual gesture it exists to replace. Hence hosted ubuntu-24.04.
#
# It attaches two files only: the wheel and the sdist. NO image. The registry is
# private and on internal DNS (registry.hawkixs.local), so its address means
# nothing to a consumer of the release; and an image would bake in the reranker's
# ONNX, whose upstream licence NOTICE declares undetermined. Publishing a digest
# stays the delivery rail's business, on its own runner.
#
# No repository secret: `GITHUB_TOKEN` is minted by the platform for this run
# alone, and `permissions:` narrows it down to writing a release.
#
# Trigger: the operator places the tag, this rail publishes. A branch push
# publishes nothing.

name: Release

on:
  push:
    tags:
      - "v*"

# The default token carries far more than a release requires.
permissions:
  contents: write

# Two tags pushed back to back publish two distinct releases: they do not
# cancel one another, they follow one another.
concurrency:
  group: brain-v42-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.10.7"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install "uv==$UV_VERSION"

      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev

      # The contract is REUSED, not copied: that file already builds a real
      # wheel and reads the full set of expected revisions off the disk.
      # Rewriting it here in YAML would give two truths that drift without
      # saying so. Measured before this contract: a wheel of 192 entries with
      # ZERO alembic, hence a package unable to migrate its own database.
      - name: Vérifier que la wheel porte les migrations
        run: .venv/bin/pytest tests/unit/test_wheel_ships_migrations.py -v --tb=short

      - name: Construire la wheel et le sdist
        run: uv build --out-dir dist

      # One shell: the guard names the artifacts, the publication attaches them.
      # Without it, a v9.9.9 tag would publish a 0.2.0 wheel and the release
      # would lie about what /health will announce. `bash -e` stops the step
      # before `gh`.
      - name: Publier la release avec ses deux artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL="dist/brain_v42-${VERSION}-py3-none-any.whl"
          SDIST="dist/brain_v42-${VERSION}.tar.gz"
          if [ ! -f "$WHEEL" ] || [ ! -f "$SDIST" ]; then
            echo "le tag ${GITHUB_REF_NAME} ne nomme pas la version construite" >&2
            ls -1 dist >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$WHEEL" "$SDIST" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
