# brain_v42 - GitHub Actions, integration rail (ADR #4).
#
# Pull requests gate here, on GitHub-hosted runners only, so they stay verifiable
# while the on-demand red-github-runner-brain-v42 is stopped. Nothing in this file
# may target [self-hosted, Linux, X64, red-ci]: that runner receives the registry
# credentials on main and must never execute pull-request code.
#
# This rail mirrors .gitlab-ci.yml job for job, minus build:docker which belongs to
# continuous-delivery.yml. Both CI systems run in parallel during the migration;
# tests/unit/test_github_workflows.py holds the parity.

name: Continuous integration

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.7"
  BRAIN_LOG_LEVEL: "WARNING"

jobs:
  lint-ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Check lint
        run: .venv/bin/ruff check . --output-format=github
      - name: Check formatting
        run: .venv/bin/ruff format --check .

  lint-mypy:
    # Blocking: mypy is clean. allow_failure let type errors silently drift 0->20
    # between 2026-03 and 2026-05 (brain learning b5256bc1).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Check types
        run: .venv/bin/mypy src/

  # tests/unit/ is not database-free: eight of its files opt into a real PostgreSQL
  # through require_test_db_url() (tests/conftest.py) and skip when
  # BRAIN_V42_TEST_DB_URL is unset. Only test-integration carried it, so those
  # tests had never run here either — a skip is green, so nothing reported the hole.
  # Count measured 2026-08-10: 51 tests unlock, not the 45 first recorded here.
  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Same topology note as test-integration: reached over the mapped port,
      # because without a job container the runner is not on the service network.
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: brain_test
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # POSTGRES_URL takes priority in conftest; brain_test (never 'brain') passes
      # the prod-guard.
      POSTGRES_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      BRAIN_V42_TEST_DB_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      GRAPH_ENABLED: "false"
      # The GPU embedding/reranker services are absent in CI; the tests that hit
      # localhost:8003 carry their own pytest.skip guard.
      EMBEDDING_SERVICE_URL: "http://localhost:8003"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      # tests/unit/ has no equivalent of the run_migrations fixture that
      # tests/integration/conftest.py runs once per session, so the schema is
      # applied here; a bare pgvector database makes the DB-backed tests fail on
      # missing relations instead of skipping. The console script, not
      # `python -m alembic`: check_container_image_pins.py is fail-closed on
      # `python -m <module>` in CI and refuses the workflow.
      - name: Apply the schema to the test database
        run: .venv/bin/alembic upgrade head
      - name: Check module layering
        run: .venv/bin/python scripts/check_module_layering.py --package src/brain_v42
      - name: Check container image pins
        run: .venv/bin/python scripts/check_container_image_pins.py
      - name: Run unit tests
        run: .venv/bin/pytest tests/unit/ -v --tb=short

  # Même topologie que test-unit, et c'est le POINT : sans le service Postgres,
  # sans BRAIN_V42_TEST_DB_URL et sans le schéma appliqué, `require_test_db_url()`
  # (tests/conftest.py) fait SAUTER les tests adossés à une base. La couverture
  # décrivait alors un sous-ensemble du code réellement testé, et rien ne le
  # disait au lecteur du pourcentage. Mesuré le 2026-08-22 : 60 tests sautés,
  # 19 instructions et 1 branche jamais comptées.
  #
  # Les deux commentaires que cette recette remplace annonçaient « 51 tests » —
  # le ticket f779092b en annonçait 55, la mesure en trouve 60. Trois nombres,
  # trois dates : c'est pourquoi le garde-fou plus bas ne compte RIEN et se
  # contente d'exiger zéro saut de cette cause.
  test-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: brain_test
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      BRAIN_V42_TEST_DB_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      GRAPH_ENABLED: "false"
      EMBEDDING_SERVICE_URL: "http://localhost:8003"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      # Même raison qu'en test-unit : tests/unit/ n'a pas d'équivalent du fixture
      # run_migrations, et une base pgvector nue ferait ÉCHOUER les tests adossés
      # à une base sur des relations manquantes au lieu de les faire passer.
      - name: Apply the schema to the test database
        run: .venv/bin/alembic upgrade head
      - name: Measure coverage
        run: >-
          .venv/bin/pytest tests/unit/ --cov=brain_v42 --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=60
          --junitxml=coverage-junit.xml
      # LE TÉMOIN INVERSÉ, et c'est lui le livrable — pas le pourcentage.
      # Réparer le chiffre seul le laisserait redériver au prochain écart de
      # recette : un test qui SAUTE ne fait pas rougir un job, donc la CI serait
      # restée verte sur une couverture partielle, exactement comme avant.
      #
      # `if: always()` : il doit parler même quand la mesure échoue par ailleurs,
      # sinon un `--cov-fail-under` rouge masquerait la raison réelle.
      - name: Refuse a coverage measured on a subset
        if: always()
        run: .venv/bin/python scripts/check_coverage_saw_the_db_tests.py coverage-junit.xml

  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Reached over the mapped port: without a job container, GitHub does not put
      # the runner on the service network, so the GitLab `alias: postgres` host has
      # no equivalent here.
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: brain_test
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # POSTGRES_URL takes priority in conftest; brain_test (never 'brain') passes
      # the prod-guard.
      POSTGRES_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      BRAIN_V42_TEST_DB_URL: "postgresql+asyncpg://brain:brain@localhost:5432/brain_test"
      GRAPH_ENABLED: "false"
      # The GPU embedding/reranker services are absent in CI; the tests that hit
      # localhost:8003 carry their own pytest.skip guard.
      EMBEDDING_SERVICE_URL: "http://localhost:8003"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      # `-o faulthandler_*` est répété ici alors que `pyproject.toml` le porte
      # déjà : c'est CE job qui a pendu deux fois, et le rendre explicite le met
      # sous les yeux de qui lit le log d'un run mort. Au bout de 120 s dans un
      # test, toutes les piles sont dumpées et le processus sort — au lieu des
      # trente minutes de silence terminées par `##[error]The operation was
      # canceled.`, qui ne disent rien de ce qui bloquait.
      #
      # PAS de `timeout --signal=INT` autour de pytest comme filet : uvicorn
      # CAPTE SIGINT (`Server.serve()` tourne sous `capture_signals()`) et le
      # transforme en `should_exit`. pytest ne lèverait pas KeyboardInterrupt et
      # le journal resterait muet — le filet renforcerait la panne.
      - name: Run integration tests
        run: >-
          .venv/bin/pytest tests/integration/ -v --tb=short
          -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

  # Dependency vulnerabilities. Audits the exported lock rather than the live venv,
  # so the scan covers exactly the graph that ships and stays reproducible. Every
  # run queries the live PyPI advisory service with no offline fallback; a bounded
  # timeout and --strict make outages fail closed.
  security-pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Export the audited lock
        run: >-
          uv export --locked --no-dev --extra dev --format requirements-txt
          --no-emit-project -o requirements-audit.txt
      - name: Audit dependencies
        run: >-
          .venv/bin/pip-audit -r requirements-audit.txt --require-hashes --disable-pip
          --vulnerability-service pypi --timeout 15 --strict --progress-spinner=off

  # The embedding supervisor has its own declared dependency graph. This job holds
  # two invariants on its committed, hash-complete lock: the lock still covers
  # requirements.txt (recompiled UNDER the lock as a constraint, so an upstream
  # release cannot move the result — an unconstrained `--resolution highest`
  # recompile went red three times in three days for zero CVEs), and the lock
  # audits clean. Freshness is not a PR gate: refresh the lock with the canonical
  # command in its header when rotating pins. This job is deliberately blocking.
  security-pip-audit-embedding-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Recompile the supervisor lock under its own constraint
        run: >-
          uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_28
          --resolution highest --generate-hashes --default-index https://pypi.org/simple
          --constraint services/embedding_supervisor/requirements.lock
          --custom-compile-command "uv pip compile --python-version 3.12 --python-platform x86_64-manylinux_2_28 --resolution highest --generate-hashes --default-index https://pypi.org/simple services/embedding_supervisor/requirements.txt -o services/embedding_supervisor/requirements.lock"
          services/embedding_supervisor/requirements.txt
          -o requirements-embedding-supervisor.generated.lock
      - name: Compare with the committed lock
        # Comments are stripped before comparing: the constraint flag only changes
        # the `# via` annotations, while every install-relevant byte — names,
        # versions, hashes — is a non-comment line and stays compared exactly.
        run: |
          grep -vE '^\s*#' services/embedding_supervisor/requirements.lock > committed.pins
          grep -vE '^\s*#' requirements-embedding-supervisor.generated.lock > generated.pins
          diff -u committed.pins generated.pins
      - name: Audit the supervisor lock
        run: >-
          .venv/bin/pip-audit -r services/embedding_supervisor/requirements.lock
          --require-hashes --disable-pip --vulnerability-service pypi --timeout 15
          --strict --progress-spinner=off

  # SAST. -ll reports medium severity and above; the low band is dominated by
  # assert_used/subprocess noise that would bury the findings worth reading.
  security-bandit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==$UV_VERSION"
      - name: Install dependencies
        run: uv sync --locked --no-dev --extra dev
      - name: Scan sources
        run: .venv/bin/bandit -ll -r src/

  # Secret scanning. `dir` scans the checked-out tree: gitleaks 8.30 dropped the
  # `detect` subcommand, and a filesystem scan is correct under the shallow clone
  # CI uses, where a history scan would silently cover only the last commits.
  security-gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Scan for secrets
        # `-w /repo` + `dir .`, never `dir /repo`: the allowlist path regexes in
        # .gitleaks.toml are anchored relative (`^ops/…`). An absolute target
        # makes gitleaks report absolute paths, none of which match, and all
        # ten triaged false positives resurface. Measured on v8.30.1:
        # `dir /repo` → 10 leaks even with --config; `-w /repo` + `dir .` → 0.
        run: >-
          docker run --rm -w /repo -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir . --no-banner --redact --exit-code 1 --report-format sarif
          --report-path gitleaks.sarif
      - name: Keep the gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
