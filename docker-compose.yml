services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    container_name: brain_v42_postgres
    restart: unless-stopped
    ports:
      # Loopback-only (security audit 2026-07-03): the port was exposed to the
      # LAN on 0.0.0.0 with weak creds. Host clients go through localhost:5433;
      # containers (red-codex) through the brain_v42_default docker network
      # (brain_v42_postgres:5432). Remote access → SSH tunnel.
      - "127.0.0.1:5433:5432"
    environment:
      # Overridable via .env — inject a real password in shared/networked
      # deployments. Defaults preserve the local-dev brain/brain on localhost:5433.
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain} -d ${POSTGRES_DB:-brain}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  embedding:
    build: ./services/embedding
    container_name: brain_v42_embedding
    # Legacy PyTorch fp16 — replaced by embedding-llama + embedding-shim
    # (cutover 2026-07-06, structural VRAM drift — learning 410eb227).
    # ROLLBACK: docker compose stop embedding-shim embedding-llama
    #            && docker compose --profile legacy up -d embedding
    profiles: ["legacy"]
    restart: unless-stopped
    # THE REFUSAL LIVES HERE AND NOT IN THE DOCKERFILE. `docker compose up` reuses
    # an existing image, and brain_v42-embedding:latest was built eight weeks ago:
    # an image-side ENTRYPOINT would stay inert until somebody rebuilt it. And the
    # rebuild is the one operation nobody can vouch for — the base is pinned by
    # digest but `torch` is not pinned at all, so eight weeks of PyTorch/CUDA drift
    # sit between this recipe and that artifact. A guard that can only arm itself
    # through the least trustworthy operation available is not a guard.
    #
    # `$$` escapes compose interpolation so the shell expands it at runtime.
    # `exec "$$@"` hands over to the image CMD, which stays the single source of
    # truth for how the server actually starts.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$$BRAIN_LEGACY_EMBEDDING_ACK" != "yes" ]; then
          echo "REFUSED: the legacy PyTorch profile is UNBOUNDED (no body cap, no read deadline, no semaphore, no 413/503) and is a rollback artifact only. Set BRAIN_LEGACY_EMBEDDING_ACK=yes to start it deliberately." >&2
          exit 78
        fi
        exec "$$@"
      - legacy-guard
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      default:
      brain-net:
        # BOTH names, not one. The two live clients on brain-net
        # (auto-discord-bot, auto-discord-dagster-daemon) carry no EMBEDDING_URL
        # and fall back to the code default `brain_v42_embedding_shim:8003`, while
        # the auto_discord compose pins `embedding-shim:8003`. Measured 2026-09-03:
        # preserving one of the two breaks the other, silently.
        # No collision: the rollback stops embedding-shim FIRST (runbook 6830f3db),
        # so the two containers are never on brain-net at the same time.
        aliases:
          - embedding-shim
          - brain_v42_embedding_shim
    environment:
      # Reduce PyTorch CUDA fragmentation drift over long uptimes.
      # Without this, repeated inferences fragment VRAM until even small
      # allocations fail (incident 2026-04-12, brain learning 410eb227).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Real healthcheck: POST a minimal /embed call so a wedged or CUDA-OOM
      # GPU is reported unhealthy. The previous /healthz probe never touched
      # the model and stayed green for 8 days during the 2026-04-12 drift
      # incident, hiding HTTP 500s on every brain MCP write.
      test: ["CMD", "python3", "-c", "import urllib.request,json; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8003/embed',data=json.dumps({'texts':['healthcheck']}).encode(),headers={'Content-Type':'application/json'}),timeout=8); assert r.read(2)==b'[['"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  embedding-llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c1ddeb6d30932ddd9ddff962cb62dbc5450cd99d8e82c8c20de2fd1f99fde85b
    container_name: brain_v42_embedding_llama
    restart: unless-stopped
    # --pooling last: the model's own sentence-transformers config (lasttoken).
    # -ub 1024: VRAM lever no.1 (2.9 GiB vs 4.7 at ub=4096, latencies
    # identical — sweep 2026-07-06, learning 906722df). Chunking with
    # ub < n_tokens is correct for a causal embedder (Qwen2).
    # -c 8192: covers the 15000-char client cap (~4-5k tokens).
    # -np 1: locked — the KV cache is PER SLOT; -np N on this 6 GiB GPU
    # means re-measuring the VRAM (N × ctx 8192).
    # --cont-batching: explicit, so as not to depend on the image's
    # defaults. NB --embd-normalize DOES NOT EXIST on llama-server (a
    # CLI/embedding-only flag — the first cutover's crashloop); the server
    # L2-normalises /v1/embeddings and the shim re-normalises (defence in depth).
    # Static VRAM allocation at startup → no drift (the durable fix for
    # the 2026-04-12 incident).
    command: >
      -m /models/qodo-embed-1.5b-q8_0.gguf
      --embedding --pooling last
      -ngl 999 -c 8192 -ub 1024 -b 8192
      -np 1 --cont-batching
      --host 0.0.0.0 --port 8080
    environment:
      # The image is built on CUDA 12.8 and ships a forward-compat layer
      # (/usr/local/cuda-12.8/compat/libcuda.so.570.124.06) declared in
      # ld.so.conf.d, which WINS over the libcuda injected from the host. A
      # compat libcuda only works with a kernel driver OLDER than itself:
      # host on 535 (< 570) → OK; host moved to 580 (> 570) →
      # CUDA_ERROR_SYSTEM_DRIVER_MISMATCH. llama-server does not die, it
      # falls back to CPU silently ("no usable GPU found") — /health stays
      # 200 and /embed simply answers ~15x slower (incident 2026-08-10,
      # kernel move 6.8.0-124 → -136).
      # Prefixing the path of the host-injected libs makes the real driver's
      # libcuda win. We PREFIX, we do not replace: the original value carries
      # the image's CUDA runtime (libcudart/libcublas).
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64
    volumes:
      - ${QODO_GGUF_DIR:-./models/qodo-gguf}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # curl is present in the image (verified 2026-07-06). llama-server's
      # /health returns 503 while the model loads, 200 afterwards.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  embedding-shim:
    build: ./services/embedding_shim
    container_name: brain_v42_embedding_shim
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      - default
      - brain-net
    environment:
      - LLAMA_URL=http://embedding-llama:8080
      # Static bearer in CENSUS mode. `optional` accepts every caller and logs
      # the ones arriving without a valid token, so the six auto-discord
      # clients on brain-net keep working while we count them. Arming this to
      # `required` is a separate operator gesture, not a config tweak.
      # Only the PATH is wired: the value would otherwise show up verbatim in
      # `docker inspect .Config.Env`. It is read once at startup, so rotating
      # the secret requires a container restart.
      - SHIM_BEARER_TOKEN_FILE=/run/secrets/embedding_shim_bearer
      - SHIM_BEARER_MODE=optional
    secrets:
      - embedding_shim_bearer
    depends_on:
      embedding-llama:
        condition: service_healthy
    healthcheck:
      # A real end-to-end healthcheck: POST /embed crosses the shim AND the
      # llama server (the same philosophy as the legacy healthcheck after
      # incident 410eb227 — never a /healthz-only false green).
      test: ["CMD", "python3", "-c", "import urllib.request,json; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8003/embed',data=json.dumps({'texts':['healthcheck']}).encode(),headers={'Content-Type':'application/json'}),timeout=15); assert r.read(2)==b'[['"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s

  neo4j:
    # Pin the exact 5.26.21 image whose _FILE secret handling is rehearsed.
    image: neo4j:5.26.21@sha256:409728716bc239f9fa046368ac6ce6ef280f9e5f0bcb7cdd75031a4465cc192d
    container_name: brain_v42_neo4j
    restart: unless-stopped
    ports:
      # Loopback-only (security audit 2026-07-03) — same reason as postgres.
      # Neo4j browser from another machine → SSH tunnel (7474 + 7687).
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_PLUGINS: '[]'
    secrets:
      - neo4j_auth
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      # The HTTP readiness endpoint needs no credentials, keeping passwords out
      # of container metadata and the healthcheck process command line.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  brain-codex-gateway:
    profiles: ["codex-gateway"]
    build:
      context: .
      target: production
    container_name: brain_v42_codex_gateway
    user: "${BRAIN_CODEX_GATEWAY_UID:-1001}:${BRAIN_CODEX_GATEWAY_GID:-1001}"
    command: ["python", "-m", "brain_v42.codex_gateway.launcher"]
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD:-brain}@postgres:5432/${POSTGRES_DB:-brain}
      EMBEDDING_SERVICE_URL: http://embedding-shim:8003
      PYTHONDONTWRITEBYTECODE: "1"
      BRAIN_CODEX_GATEWAY_HOST: "0.0.0.0"
      BRAIN_CODEX_GATEWAY_ALLOW_ALL_INTERFACES: "true"
      BRAIN_CODEX_GATEWAY_PORT: "9211"
      BRAIN_CODEX_GATEWAY_TOKEN_FILE: /run/secrets/codex-gateway.env
      BRAIN_CODEX_GATEWAY_KILLSWITCHES_PATH: /run/brain-v42/killswitches.conf
    volumes:
      - ${BRAIN_CODEX_GATEWAY_ENV_FILE:-./.secrets/codex-gateway.env}:/run/secrets/codex-gateway.env:ro
      - ${BRAIN_DREAM_KILLSWITCHES_FILE:-./.secrets/killswitches.conf}:/run/brain-v42/killswitches.conf:ro
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9211/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  neo4j_auth:
    file: ${BRAIN_NEO4J_AUTH_FILE:-./.secrets/neo4j-auth}
  # Compose bind-mounts this file as-is: the mode the shim sees is the mode on
  # the host. The loader refuses anything readable beyond its owner, so the
  # host file must be 0600 or the container will not start.
  embedding_shim_bearer:
    file: ${BRAIN_SHIM_BEARER_FILE:-./.secrets/embedding-shim-bearer}

networks:
  default:
  brain-net:
    external: true
