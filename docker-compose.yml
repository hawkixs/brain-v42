services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: brain_v42_postgres
    restart: unless-stopped
    ports:
      # Loopback-only (audit sécu 2026-07-03) : le port était exposé LAN sur
      # 0.0.0.0 avec creds faibles. Les clients hôte passent par localhost:5433 ;
      # les containers (red-codex) par le réseau docker brain_v42_default
      # (brain_v42_postgres:5432). Accès distant → tunnel SSH.
      - "127.0.0.1:5433:5432"
    environment:
      # Overridable via .env — inject a real password in shared/networked
      # deployments. Defaults preserve the local-dev brain/brain on localhost:5433.
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brain}
      POSTGRES_DB: ${POSTGRES_DB:-brain}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain} -d ${POSTGRES_DB:-brain}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  embedding:
    build: ./services/embedding
    container_name: brain_v42_embedding
    # PyTorch fp16 legacy — remplacé par embedding-llama + embedding-shim
    # (cutover 2026-07-06, drift VRAM structurel — learning 410eb227).
    # ROLLBACK : docker compose stop embedding-shim embedding-llama
    #            && docker compose --profile legacy up -d embedding
    profiles: ["legacy"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      - default
      - brain-net
    environment:
      # Reduce PyTorch CUDA fragmentation drift over long uptimes.
      # Without this, repeated inferences fragment VRAM until even small
      # allocations fail (incident 2026-04-12, brain learning 410eb227).
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Real healthcheck: POST a minimal /embed call so a wedged or CUDA-OOM
      # GPU is reported unhealthy. The previous /healthz probe never touched
      # the model and stayed green for 8 days during the 2026-04-12 drift
      # incident, hiding HTTP 500s on every brain MCP write.
      test: ["CMD", "python3", "-c", "import urllib.request,json; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8003/embed',data=json.dumps({'texts':['healthcheck']}).encode(),headers={'Content-Type':'application/json'}),timeout=8); assert r.read(2)==b'[['"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  embedding-llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:c1ddeb6d30932ddd9ddff962cb62dbc5450cd99d8e82c8c20de2fd1f99fde85b
    container_name: brain_v42_embedding_llama
    restart: unless-stopped
    # --pooling last : config sentence-transformers du modèle (lasttoken).
    # -ub 1024 : levier VRAM n°1 (2.9 GiB vs 4.7 à ub=4096, latences
    # identiques — sweep 2026-07-06, learning 906722df). Le chunking
    # ub < n_tokens est correct pour un embedder causal (Qwen2).
    # -c 8192 : couvre le cap client 15000 chars (~4-5k tokens).
    # -np 1 : verrouillé — le KV cache est PAR SLOT ; -np N sur ce GPU
    # 6 GiB implique de re-mesurer la VRAM (N × ctx 8192).
    # --cont-batching : explicite pour ne pas dépendre des défauts de
    # l'image. NB --embd-normalize N'EXISTE PAS sur llama-server (flag
    # CLI/embedding only — crashloop du 1er cutover) ; le serveur L2-
    # normalise /v1/embeddings et le shim re-normalise (défense en prof.).
    # Allocation VRAM statique au démarrage → pas de drift (le fix
    # durable de l'incident 2026-04-12).
    command: >
      -m /models/qodo-embed-1.5b-q8_0.gguf
      --embedding --pooling last
      -ngl 999 -c 8192 -ub 1024 -b 8192
      -np 1 --cont-batching
      --host 0.0.0.0 --port 8080
    environment:
      # L'image est bâtie sur CUDA 12.8 et embarque une couche forward-compat
      # (/usr/local/cuda-12.8/compat/libcuda.so.570.124.06) déclarée dans
      # ld.so.conf.d, qui GAGNE sur la libcuda injectée depuis l'hôte. Une
      # libcuda compat ne fonctionne qu'avec un driver noyau PLUS ANCIEN
      # qu'elle : hôte en 535 (< 570) → OK ; hôte passé en 580 (> 570) →
      # CUDA_ERROR_SYSTEM_DRIVER_MISMATCH. llama-server ne meurt pas, il
      # tombe en repli CPU silencieux (« no usable GPU found ») — /health
      # reste 200 et /embed répond juste ~15x plus lentement (incident
      # 2026-08-10, bascule noyau 6.8.0-124 → -136).
      # Préfixer le chemin des libs injectées par l'hôte fait gagner la
      # libcuda du driver réel. On PRÉFIXE, on ne remplace pas : la valeur
      # d'origine porte le runtime CUDA (libcudart/libcublas) de l'image.
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64
    volumes:
      - ${QODO_GGUF_DIR:-./models/qodo-gguf}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # curl présent dans l'image (vérifié 2026-07-06). /health de
      # llama-server retourne 503 tant que le modèle charge, 200 ensuite.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  embedding-shim:
    build: ./services/embedding_shim
    container_name: brain_v42_embedding_shim
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    networks:
      - default
      - brain-net
    environment:
      - LLAMA_URL=http://embedding-llama:8080
    depends_on:
      embedding-llama:
        condition: service_healthy
    healthcheck:
      # Healthcheck réel de bout en bout : POST /embed traverse le shim
      # ET le serveur llama (même philosophie que le healthcheck legacy
      # post-incident 410eb227 — jamais de /healthz-only false-green).
      test: ["CMD", "python3", "-c", "import urllib.request,json; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8003/embed',data=json.dumps({'texts':['healthcheck']}).encode(),headers={'Content-Type':'application/json'}),timeout=15); assert r.read(2)==b'[['"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s

  neo4j:
    # Pin the exact 5.26.21 image whose _FILE secret handling is rehearsed.
    image: neo4j:5.26.21@sha256:409728716bc239f9fa046368ac6ce6ef280f9e5f0bcb7cdd75031a4465cc192d
    container_name: brain_v42_neo4j
    restart: unless-stopped
    ports:
      # Loopback-only (audit sécu 2026-07-03) — même raison que postgres.
      # Browser Neo4j depuis une autre machine → tunnel SSH (7474 + 7687).
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_PLUGINS: '[]'
    secrets:
      - neo4j_auth
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      # The HTTP readiness endpoint needs no credentials, keeping passwords out
      # of container metadata and the healthcheck process command line.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  brain-codex-gateway:
    profiles: ["codex-gateway"]
    build:
      context: .
      target: production
    container_name: brain_v42_codex_gateway
    user: "${BRAIN_CODEX_GATEWAY_UID:-1001}:${BRAIN_CODEX_GATEWAY_GID:-1001}"
    command: ["python", "-m", "brain_v42.codex_gateway.launcher"]
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-brain}:${POSTGRES_PASSWORD:-brain}@postgres:5432/${POSTGRES_DB:-brain}
      EMBEDDING_SERVICE_URL: http://embedding-shim:8003
      PYTHONDONTWRITEBYTECODE: "1"
      BRAIN_CODEX_GATEWAY_HOST: "0.0.0.0"
      BRAIN_CODEX_GATEWAY_ALLOW_ALL_INTERFACES: "true"
      BRAIN_CODEX_GATEWAY_PORT: "9211"
      BRAIN_CODEX_GATEWAY_TOKEN_FILE: /run/secrets/codex-gateway.env
      BRAIN_CODEX_GATEWAY_KILLSWITCHES_PATH: /run/brain-v42/killswitches.conf
    volumes:
      - ${BRAIN_CODEX_GATEWAY_ENV_FILE:-./.secrets/codex-gateway.env}:/run/secrets/codex-gateway.env:ro
      - ${BRAIN_DREAM_KILLSWITCHES_FILE:-./.secrets/killswitches.conf}:/run/brain-v42/killswitches.conf:ro
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9211/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  neo4j_auth:
    file: ${BRAIN_NEO4J_AUTH_FILE:-./.secrets/neo4j-auth}

networks:
  default:
  brain-net:
    external: true
