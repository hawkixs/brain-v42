# ─────────────────────────────────────────────────────────────────────────────
# Triaged 2026-08-22 — the two findings the trigger-function census introduced.
#
# Same line in both twin assets. It is a SHA-256 of the body of a PostgreSQL
# trigger function, next to that body's octet count (226), in the versioned
# recovery contract. `pg_proc.prosrc` for `reject_project_context_key_change`
# is public DDL: anyone holding the schema recomputes it. It grants nothing.
#
# THE MECHANISM, MEASURED — and it is not the one the finding suggests. Two
# conditions must hold TOGETHER, both established on a six-line fixture against
# v8.30.1 on 2026-08-22, one factor changed at a time:
#
#   (1) the line must carry the `key` keyword before the quoted digest. The
#       census holds 14 fingerprints; 12 have no `key` in their name and are
#       silent. `sync_project_registry`, entropy 3.8684 — HIGHER than the
#       flagged one — is not flagged.
#
#   (2) the match must contain no gitleaks STOPWORD. This is the part that
#       explains the rest, and it is pure vocabulary luck. TWO of the 14
#       function names contain `key`, not one: `normalize_project_key_alias`
#       (line 1898) and `reject_project_context_key_change` (line 1900). Only
#       the second is flagged, because `alias` is a stopword. Proven both ways
#       on the fixture: renaming `..._key_alias` to `..._key_zzzzz` makes it
#       FLAG, and renaming `..._key_change` to `..._key_alias` makes it GO
#       SILENT.
#
# Entropy is not the discriminator: the unflagged `..._key_alias` digest scores
# 3.7061, above the rule's 3.5 threshold.
#
# CONSEQUENCE TO EXPECT, so nobody reads a future red as a regression: any new
# trigger function whose name contains `key` and no stopword raises this same
# false positive and needs its own dated entry. That is the gate working.
#
# The digest is pinned LITERALLY below. If the function body ever changes, the
# fingerprint changes, these entries stop matching, and the gate goes red again
# — the correct outcome: a new digest is a new thing, looked at rather than
# inherited.
# ─────────────────────────────────────────────────────────────────────────────

[[rules.allowlists]]
description = """
Triaged 2026-08-22. Trigger-function fingerprint in the v5 recovery contract: \
`sha256(pg_proc.prosrc)` of `reject_project_context_key_change()`, next to its \
octet count, verified against the live database at head 046. Flagged only \
because the function name contains "key" and the match holds no gitleaks \
stopword — the sibling `normalize_project_key_alias` two lines above carries \
the same shape and is silent solely because "alias" IS a stopword.
"""
condition = "AND"
regexTarget = "line"
paths = ['''^ops/recovery/brain-v42-v5\.sql$''']
regexes = ['''\('reject_project_context_key_change', 'e800aecbe1054d8333babd1c43f1f52893db81b6b8f4e7fc6d167c6cd6f9de82', 226\)''']

[[rules.allowlists]]
description = """
Triaged 2026-08-22. The same trigger-function fingerprint in the pg_restore \
variant. The two assets are held in CTE parity by a test, so this literal is \
identical on both sides by construction — one triage, two entries, because a \
path regex cannot span both files without widening to the directory, and \
widening to `ops/recovery/` would stop scanning the two files that carry the \
entire database schema.
"""
condition = "AND"
regexTarget = "line"
paths = ['''^ops/recovery/brain-v42-v5-pgrestore\.sql$''']
regexes = ['''\('reject_project_context_key_change', 'e800aecbe1054d8333babd1c43f1f52893db81b6b8f4e7fc6d167c6cd6f9de82', 226\)''']

